<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="-apple-system, SF Pro Display, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/><stop offset="1" stop-color="#0b0f1a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c6fdb"/><stop offset="1" stop-color="#2356b8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="420" fill="url(#bg)"/>
  <!-- title -->
  <text x="640" y="120" text-anchor="middle" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="-1">SystemBar</text>
  <text x="640" y="166" text-anchor="middle" font-size="23" fill="#aab4c8">A tidy, transparent menu bar for macOS</text>
  <!-- mock menu bar -->
  <g filter="url(#shadow)">
    <rect x="180" y="230" width="920" height="44" rx="10" fill="url(#bar)"/>
    <!-- left: app menus -->
    <text x="206" y="259" font-size="16" font-weight="700" fill="#fff"></text>
    <text x="236" y="259" font-size="15" font-weight="700" fill="#fff">SystemBar</text>
    <!-- chevron (collapse control) -->
    <g transform="translate(150,0)">
      <rect x="640" y="238" width="34" height="28" rx="7" fill="#ffffff" fill-opacity="0.22"/>
      <path d="M662 246 l-7 6 l7 6 M654 246 l-7 6 l7 6" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- right cluster: a few status icons -->
    <g fill="#ffffff">
      <!-- wifi -->
      <path transform="translate(854,244)" d="M12 4 C6 4 2 7 0 9 l3 3 C5 10 8 8 12 8 C16 8 19 10 21 12 l3-3 C22 7 18 4 12 4 Z" fill-opacity="0.95"/>
      <circle cx="866" cy="262" r="2.4"/>
      <!-- battery -->
      <rect x="906" y="250" width="34" height="16" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="909" y="253" width="24" height="10" rx="2"/>
      <rect x="941" y="255" width="3" height="6" rx="1.5"/>
      <!-- control center -->
      <rect x="966" y="249" width="30" height="18" rx="5" fill="none" stroke="#fff" stroke-width="2"/>
      <circle cx="974" cy="258" r="3"/><circle cx="988" cy="258" r="3"/>
    </g>
    <!-- clock -->
    <text x="1066" y="259" font-size="14" fill="#fff" text-anchor="end">9:41</text>
  </g>
  <text x="640" y="340" text-anchor="middle" font-size="15" fill="#7d879c">Collapse the clutter · Reveal what you need · See every icon</text>
</svg>
