<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" font-family="-apple-system, SF Pro Text, system-ui, sans-serif">
  <defs>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c6fdb"/><stop offset="1" stop-color="#2659bd"/></linearGradient>
    <filter id="panelsh"><feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/></filter>
  </defs>
  <rect width="1280" height="360" fill="#0e1320"/>
  <text x="60" y="56" font-size="18" font-weight="700" fill="#9db4ff">Show All Icons — every status item, hidden &amp; visible</text>

  <!-- menu bar -->
  <rect x="60" y="78" width="1160" height="40" rx="9" fill="url(#bar3)"/>
  <g transform="translate(1000,0)">
    <rect x="0" y="88" width="32" height="20" rx="6" fill="#fff" fill-opacity="0.3"/>
    <path d="M22 92 l-6 6 l6 6 M14 92 l-6 6 l6 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1196" y="103" font-size="13" fill="#fff" text-anchor="end">9:41</text>

  <!-- floating dark panel below, with rounded corners + border -->
  <g filter="url(#panelsh)">
    <rect x="690" y="140" width="500" height="58" rx="14" fill="#1d1f24" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  </g>
  <!-- row of real icons inside -->
  <g fill="#ffffff" transform="translate(714,169)">
    <!-- 10 distinct glyphs -->
    <g><path d="M10 -7 C5 -7 2 -5 0 -3 l2.5 2.5 C4 -4 7 -5.5 10 -5.5 C13 -5.5 16 -4 17.5 -2.5 L20 -5 C18 -7 15 -9 10 -9 Z" transform="translate(0,4)"/></g>
    <g transform="translate(46,-8)"><rect width="28" height="14" rx="3.5" fill="none" stroke="#fff" stroke-width="2"/><rect x="3" y="3" width="18" height="8" rx="2"/></g>
    <g transform="translate(96,-8)"><rect width="26" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="7" cy="8" r="2.5"/><circle cx="19" cy="8" r="2.5"/></g>
    <g transform="translate(140,-8)"><circle cx="8" cy="8" r="8" fill="none" stroke="#fff" stroke-width="2"/><path d="M8 3 v5 l3 2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <g transform="translate(180,-9)"><path d="M9 0 l2.5 6 H18 l-5 4 l2 6 l-6 -4 l-6 4 l2 -6 l-5 -4 H6.5 z"/></g>
    <g transform="translate(222,-8)"><rect width="16" height="16" rx="4"/></g>
    <g transform="translate(262,-8)"><circle cx="8" cy="8" r="8"/></g>
    <g transform="translate(302,-8)"><path d="M0 8 a8 8 0 0 1 16 0 z"/></g>
    <g transform="translate(344,-8)"><rect width="16" height="16" rx="8" fill="none" stroke="#fff" stroke-width="2"/><circle cx="8" cy="8" r="3"/></g>
    <g transform="translate(386,-8)"><path d="M2 2 h12 v12 h-12 z M5 5 h6 v6 h-6 z" fill-rule="evenodd"/></g>
  </g>
  <!-- connector arrow from chevron to panel -->
  <path d="M1016 122 q-150 6 -260 16" stroke="#9db4ff" stroke-width="2" fill="none" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="640" y="270" text-anchor="middle" font-size="14" fill="#7d879c">Notch-safe floating panel · real captured images · click any icon to activate it</text>
  <text x="640" y="300" text-anchor="middle" font-size="13" fill="#5c6580">Even hidden Control Center items appear here</text>
</svg>
