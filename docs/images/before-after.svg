<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system, SF Pro Text, system-ui, sans-serif">
  <defs>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c6fdb"/><stop offset="1" stop-color="#2659bd"/>
    </linearGradient>
    <filter id="sh2"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.3"/></filter>
  </defs>
  <rect width="1280" height="320" fill="#0e1320"/>

  <!-- BEFORE -->
  <text x="60" y="58" font-size="18" font-weight="700" fill="#ff6b6b">Before — cluttered</text>
  <g filter="url(#sh2)">
    <rect x="60" y="78" width="1160" height="40" rx="9" fill="url(#bar2)"/>
    <g fill="#fff">
      <!-- a long row of varied icons -->
      <circle cx="700" cy="98" r="8"/><rect x="724" y="90" width="16" height="16" rx="3"/>
      <path d="M756 90 h16 v16 h-16 z" fill-opacity="0.9"/><circle cx="794" cy="98" r="8"/>
      <rect x="812" y="90" width="16" height="16" rx="8"/><path d="M844 92 l12 6 l-12 6 z"/>
      <circle cx="878" cy="98" r="8"/><rect x="898" y="90" width="16" height="16" rx="3"/>
      <circle cx="930" cy="98" r="8"/><rect x="950" y="90" width="20" height="16" rx="4"/>
      <circle cx="990" cy="98" r="8"/><rect x="1010" y="90" width="16" height="16" rx="3"/>
      <circle cx="1042" cy="98" r="8"/><rect x="1062" y="90" width="20" height="16" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <text x="1196" y="103" font-size="13" fill="#fff" text-anchor="end">9:41</text>
  </g>

  <!-- AFTER -->
  <text x="60" y="200" font-size="18" font-weight="700" fill="#51d88a">After — tidy</text>
  <g filter="url(#sh2)">
    <rect x="60" y="220" width="1160" height="40" rx="9" fill="url(#bar2)"/>
    <!-- chevron + few pinned -->
    <g transform="translate(980,0)">
      <rect x="0" y="230" width="32" height="20" rx="6" fill="#fff" fill-opacity="0.22"/>
      <path d="M22 234 l-6 6 l6 6 M14 234 l-6 6 l6 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g fill="#fff">
      <path transform="translate(1042,226)" d="M10 3 C5 3 2 5 0 7 l2.5 2.5 C4 8 7 6.5 10 6.5 C13 6.5 16 8 17.5 9.5 L20 7 C18 5 15 3 10 3 Z"/>
      <rect x="1086" y="230" width="28" height="14" rx="3.5" fill="none" stroke="#fff" stroke-width="2"/><rect x="1089" y="233" width="18" height="8" rx="2"/>
      <rect x="1126" y="230" width="26" height="16" rx="5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="1133" cy="238" r="2.5"/><circle cx="1145" cy="238" r="2.5"/>
    </g>
    <text x="1196" y="245" font-size="13" fill="#fff" text-anchor="end">9:41</text>
  </g>
  <text x="640" y="300" text-anchor="middle" font-size="14" fill="#7d879c">One click (or ⌃⌥⌘B) hides everything left of the divider</text>
</svg>
